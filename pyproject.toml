[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goals"
version = "0.1.0"
description = "Super clean, minimal 2-pane goal & workspace manager for the terminal"
readme = "README.md"
authors = [{ name = "Omni" }]
dependencies = [
    "textual>=0.50.0",
]
requires-python = ">=3.9"

[project.scripts]
goals = "goals.cli:main"
